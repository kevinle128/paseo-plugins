name: Publish

on:
  push:
    branches: [main]
    paths:
      - plugins/**
      - categories.json
      - featured.json
      - scripts/**
  schedule:
    # Daily, so install counts stay current.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY_OWNERS: kevinle128
      REGISTRY_URL: https://kevinle128.github.io/paseo-plugins
      REGISTRY_NAME: "Paseo fork plugins"
      INSTALLS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load Agent-Memory deploy key
        env:
          AGENT_MEMORY_DEPLOY_KEY: ${{ secrets.AGENT_MEMORY_DEPLOY_KEY }}
        run: |
          if [ -z "$AGENT_MEMORY_DEPLOY_KEY" ]; then
            echo "AGENT_MEMORY_DEPLOY_KEY is empty"
            exit 1
          fi
          key="$RUNNER_TEMP/agent-memory-deploy-key"
          umask 077
          printf '%s\n' "$AGENT_MEMORY_DEPLOY_KEY" > "$key"
          chmod 0600 "$key"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Build registry
        run: |
          set -o pipefail
          node scripts/build.ts 2>&1 | tee "$RUNNER_TEMP/registry-build.log"
      - name: Require three published plugins
        run: |
          jq -e '.plugins | length == 3' dist/index.json
          grep -qx 'dist/index.json: 3 plugin(s), 0 skipped' "$RUNNER_TEMP/registry-build.log"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/agent-memory-deploy-key"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
